name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy whatsapp-webhook
        run: supabase functions deploy whatsapp-webhook --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-reminder
        run: supabase functions deploy send-reminder --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-broadcast
        run: supabase functions deploy admin-broadcast --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy process-scheduled-broadcasts
        run: supabase functions deploy process-scheduled-broadcasts --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy kirvano-webhook
        run: supabase functions deploy kirvano-webhook --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy lookup-sale-email
        run: supabase functions deploy lookup-sale-email --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-settings
        run: supabase functions deploy admin-settings --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy weekly-briefing
        run: supabase functions deploy weekly-briefing --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy generate-financial-insight
        run: supabase functions deploy generate-financial-insight --project-ref fnilyapvhhygfzcdxqjm
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy daily-briefing
        run: supabase functions deploy daily-briefing --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # oauth-callback recebe redirect do Google/Notion sem auth Supabase → no-verify-jwt
      - name: Deploy oauth-callback
        run: supabase functions deploy oauth-callback --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # oauth-init é chamado pelo frontend pra montar URL de autorização
      - name: Deploy oauth-init
        run: supabase functions deploy oauth-init --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # process-recurring é chamado pelo pg_cron diariamente (workflow de
      # confirmação de cobranças recorrentes via WhatsApp)
      - name: Deploy process-recurring
        run: supabase functions deploy process-recurring --project-ref fnilyapvhhygfzcdxqjm --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
